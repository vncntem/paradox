version: '3.8'

services:
  api:
    build: .
    container_name: backend-api-1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://backend-mongodb-1:27017/paradox
      - SMTP_ENABLED=false
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - bridge

  mongodb:
    image: mongo:latest
    container_name: backend-mongodb-1
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - bridge

networks:
  bridge:
    driver: bridge

volumes:
  mongodb_data:
