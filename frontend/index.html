<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARADOX</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Test API connection
            fetch('https://email-api.thisisparadox.com/health')
                .then(response => response.json())
                .then(data => console.log('API Health Check:', data))
                .catch(error => console.error('API Health Check Failed:', error));

            // Particle background
            particlesJS('particles-js', {
                particles: {
                    number: {
                        value: 80,
                        density: {
                            enable: true,
                            value_area: 800
                        }
                    },
                    color: {
                        value: "#ff3366"
                    },
                    shape: {
                        type: "circle"
                    },
                    opacity: {
                        value: 0.6,
                        random: false,
                        anim: {
                            enable: false
                        }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: {
                            enable: false
                        }
                    },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#ff3366",
                        opacity: 0.3,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: false,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: {
                            enable: true,
                            mode: "grab"
                        },
                        onclick: {
                            enable: true,
                            mode: "push"
                        },
                        resize: true
                    },
                    modes: {
                        grab: {
                            distance: 140,
                            line_linked: {
                                opacity: 0.5
                            }
                        },
                        push: {
                            particles_nb: 4
                        }
                    }
                },
                retina_detect: true
            });

            // Parallax effect
            window.addEventListener('scroll', function() {
                const scrolled = window.pageYOffset;
                document.querySelector('.tagline').style.transform = `translateY(${scrolled * 0.3}px)`;
            });

            // Email form handling with animation
            const form = document.querySelector('.email-form');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = form.querySelector('.email-input').value;
                const btn = form.querySelector('.submit-btn');
                const originalText = btn.textContent;
                
                btn.style.width = btn.offsetWidth + 'px';
                btn.textContent = '✨';
                btn.classList.add('success');

                console.log('Attempting to submit email:', email);
                
                try {
                    const response = await fetch('https://email-api.thisisparadox.com/api/subscribe', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ email })
                    });

                    console.log('Response status:', response.status);
                    const textResponse = await response.text();
                    console.log('Raw response:', textResponse);
                    
                    let data;
                    try {
                        data = JSON.parse(textResponse);
                        console.log('Response data:', data);
                    } catch (parseError) {
                        console.error('Failed to parse response:', parseError);
                        throw new Error('Invalid server response');
                    }
                    
                    if (!response.ok) {
                        throw new Error(data.message || 'Subscription failed');
                    }

                    // Success animation
                    setTimeout(() => {
                        btn.textContent = 'Welcome to Mystery';
                    }, 1000);
                    
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.classList.remove('success');
                        form.reset();
                    }, 3000);

                } catch (error) {
                    console.error('Submission error:', error);
                    
                    if (error.message === 'Failed to fetch') {
                        btn.textContent = 'Cannot reach server';
                    } else if (error.message === 'Email already subscribed') {
                        btn.textContent = 'Already joined';
                    } else {
                        btn.textContent = 'Error - Try again';
                    }
                    
                    btn.style.color = '#ff3366';
                    
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.color = '';
                        btn.classList.remove('success');
                    }, 3000);
                }
            });
        });
    </script>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="brand-name">PARADOX</div>
    
    <main class="main-content">
        <div class="logo-container">
            <img src="paradox_logo_full.png" alt="PARADOX Logo" class="logo">
            <p class="tagline">unconventional by design</p>
        </div>
    </main>

    <section class="email-capture">
        <form class="email-form">
            <input type="email" class="email-input" placeholder="join the paradox" required>
            <button type="submit" class="submit-btn">join</button>
        </form>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <div class="copyright">
                © 2025 PARADOX. All rights reserved.
            </div>
            <div class="footer-nav">
                <div class="footer-section">
                    <h3>legal</h3>
                    <ul class="footer-links">
                        <li><a href="privacy.html">Privacy Policy</a></li>
                        <li><a href="terms.html">Terms of Service</a></li>
                        <li><a href="cookies.html">Cookie Policy</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>site map</h3>
                    <ul class="footer-links">
                        <li><a href="#home">Home</a></li>
                        <li><a href="#about">About</a></li>
                        <li><a href="#features">Features</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>connect</h3>
                    <ul class="footer-links">
                        <li><a href="https://www.linkedin.com/company/xodarap">LinkedIn</a></li>
                        <li><a href="mailto:connect@thisisparadox.com">Email</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const taglines = [
            'unconventional by design',
            'embrace the unknown',
            'where logic meets chaos',
            'defy convention',
            'expect the unexpected',
            'beyond ordinary',
            'a wink and a nod',
            'surprise and delight',
            'service is selfish; be selfish',
            'the more you know, the less you know'
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const tagline = document.querySelector('.tagline');
            const randomTagline = taglines[Math.floor(Math.random() * taglines.length)];
            tagline.textContent = randomTagline;
        });
    </script>
</body>
</html>
